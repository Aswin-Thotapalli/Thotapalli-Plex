# Signed Android App Bundles for the Google Play Console.
#
# The Play Console accepts an .aab, not an .apk: Google re-packages a bundle into
# per-device APKs on the server and signs them with the Play App Signing key, so the
# self-hosted sideload channel in release.yml (which ships installable .apk files) cannot
# feed Play. This workflow exists solely to produce the two bundles the app owner uploads
# to Play: one for phone and tablet (:app:mobile) and one for Android TV (:app:tv).
#
# It deliberately mirrors release.yml for the JDK, Gradle, Android SDK and keystore steps,
# and signs with the same THOTAPALLI_* upload key. It does NOT create a GitHub Release or an
# update manifest: Play distributes these, not GitHub. The bundles are left as workflow
# artefacts for the owner to download and upload to the Play Console by hand.
name: Build Android AAB

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  bundle:
    name: Signed phone and television AABs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Confirms gradle-wrapper.jar is the checksummed original and not a substitute.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 per CLAUDE.md section 4. The runner image does not carry it.
      - name: Install the Android platform and build tools
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      # --- versionCode: epoch seconds, computed once here and passed to Gradle ------------------
      #
      # Google PERMANENTLY burns a versionCode the instant an .aab is uploaded to any Play track,
      # even if that upload is later discarded. A retried or re-cut release therefore collides
      # with itself if it reuses a sequential code, and Play refuses the upload ("Version code N
      # has already been used"). It also refuses any code that is not strictly greater than the
      # highest ever seen.
      #
      # Epoch seconds solve all of this at once:
      #   - never collide      - a second is only ever consumed once,
      #   - always increasing  - later builds always carry a larger number,
      #   - never the shadow-prone code 1 - the value gradle.properties ships for the sideload
      #     channel, which a fresh Play app can shadow-block; epoch codes are ~1.7 billion and up.
      #
      # Computed ONCE for the whole job so the phone and television bundles of one release share
      # a single code, matching how release.yml treats them as one version. gradle.properties is
      # left untouched (its versionCode=1 stays the source of truth for the self-hosted sideload
      # channel in release.yml); -Pthotapalli.versionCode overrides it only for these bundles,
      # because app/mobile and app/tv read versionCode from providers.gradleProperty(...).
      - name: Compute the epoch versionCode
        id: versioncode
        run: |
          EPOCH=$(date +%s)
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"
          echo "Play versionCode for this run: ${EPOCH}"

      # Written to the runner's temporary directory, never into the checkout, so no keystore
      # can be picked up by a later git operation. The runner is discarded after the job.
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "the KEYSTORE_BASE64 secret is not set; see docs/RELEASING.md" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/release.jks"
          echo "THOTAPALLI_KEYSTORE_FILE=${RUNNER_TEMP}/release.jks" >> "$GITHUB_ENV"

      # One upload key for both bundles, per CLAUDE.md section 17 point 1. With Play App Signing,
      # this is the *upload* key; Play re-signs each delivered APK with its own app-signing key.
      - name: Bundle the signed AABs
        env:
          THOTAPALLI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          THOTAPALLI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          THOTAPALLI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew :app:mobile:bundleRelease :app:tv:bundleRelease
          -Pthotapalli.versionCode=${{ steps.versioncode.outputs.epoch }}
          --stacktrace

      # Named for the Play target rather than left as the module name AGP gives them.
      - name: Collect the AABs
        run: |
          set -e
          mkdir -p artefacts
          for module in mobile tv; do
            aab="$(find "app/${module}/build/outputs/bundle/release" -name '*.aab' | head -n 1)"
            if [ -z "$aab" ]; then
              echo "bundleRelease produced no AAB for app/${module}" >&2
              exit 1
            fi
            cp "$aab" "artefacts/thotapalli-plex-${module}.aab"
          done

      - name: Upload the AABs
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: artefacts/*.aab
          if-no-files-found: error
          # 90 days (the plan maximum) so a bundle is still there weeks after a release is cut,
          # rather than vanishing after a week before it reaches the Play Console.
          retention-days: 90

      # The bundles are workflow artefacts (Play distributes them, not GitHub Releases), which live
      # on THIS run's page rather than the Releases page. Spell out exactly where to click, so the
      # .aab is never something to hunt for.
      - name: Where to download the AAB
        if: always()
        run: |
          {
            echo "## Android App Bundles ready to upload to Play"
            echo ""
            echo "Scroll to the **Artifacts** section at the bottom of this run's summary and download **android-aab**:"
            echo ""
            echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo ""
            echo "It contains:"
            echo "- \`thotapalli-plex-mobile.aab\` — upload to the Play Console (phone & tablet)"
            echo "- \`thotapalli-plex-tv.aab\` — upload to the Play Console (Android TV)"
            echo ""
            echo "Play versionCode for this run: \`${{ steps.versioncode.outputs.epoch }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
