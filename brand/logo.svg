<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="plate" x1="0.08" y1="0.05" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#232A54"/>
      <stop offset="100%" stop-color="#0A0C17"/>
    </linearGradient>
    <linearGradient id="amber" x1="0.23" y1="0.23" x2="0.77" y2="0.77">
      <stop offset="0%" stop-color="#FFD37A"/>
      <stop offset="50%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#D4820C"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.29" cy="0.23" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.582" r="0.45">
      <stop offset="0%" stop-color="#F5A623" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="plateClip">
      <rect x="16" y="16" width="480" height="480" rx="116"/>
    </clipPath>
  </defs>

  <!--
    The Thotapalli Plex mark (CLAUDE.md section 15, enriched for the glass redesign): a deep-indigo
    glass plate lit by a cool top-left specular and a warm backlit amber halo, carrying a rounded
    bar above a rounded play triangle in the amber gradient — read at once as the letter T and a
    play control. This is the single source of the geometry shared by the app icon, the Compose
    mark (AppLogo), the animated launch splash, and the Windows raster icon.

    Mark bounding box: x 116..396, y 120..390. Centre 256, 255. Triangle centroid 256, 298.
  -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#plate)"/>
  <g clip-path="url(#plateClip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#sheen)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#glow)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>

  <rect x="116" y="120" width="280" height="60" rx="30" fill="url(#amber)"/>
  <path d="M193 230 L193 366 Q193 390 214.6 379.5 L361.4 308.5 Q383 298 361.4 287.5 L214.6 216.5 Q193 206 193 230 Z"
        fill="url(#amber)"/>
</svg>
