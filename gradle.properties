org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
kotlin.code.style=official

# SDK levels from CLAUDE.md section 4. Held here rather than repeated across thirteen
# subprojects. Dependency versions live in gradle/libs.versions.toml and nowhere else.
thotapalli.compileSdk=37
thotapalli.targetSdk=37
thotapalli.minSdk=31
thotapalli.jdk=21

# Application version. One value, shared by phone, television and Windows, so the
# update manifest in CLAUDE.md section 17 compares a single version code per release.
thotapalli.versionCode=1
thotapalli.versionName=0.1.0
